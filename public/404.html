<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>NutriFit AI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        text-align: center;
      }
      .card {
        background: #1c1c1e;
        border: 1px solid #38383a;
        border-radius: 24px;
        padding: 32px 24px;
        max-width: 380px;
        width: 90%;
        margin: auto;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      }
      .icon-box {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(135deg, #06b6d4, #10b981);
        color: #000000;
        font-size: 26px;
        font-weight: 900;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-shadow: 0 8px 24px rgba(6, 182, 212, 0.3);
      }
      h1 {
        font-size: 19px;
        font-weight: 800;
        color: #ffffff;
        margin: 0 0 10px 0;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 13px;
        color: #8e8e93;
        margin: 0 0 24px 0;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        width: 100%;
        background: linear-gradient(135deg, #0891b2, #059669);
        color: #ffffff;
        font-weight: 700;
        font-size: 13px;
        padding: 12px 20px;
        border-radius: 14px;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .btn:active {
        transform: scale(0.96);
        opacity: 0.9;
      }
    </style>
    <script>
      // Automatically redirect to the app root on GitHub Pages without showing an error
      try {
        var pathname = window.location.pathname;
        var parts = pathname.split('/').filter(Boolean);
        // If hosted on https://<user>.github.io/<repo>/...
        if (parts.length > 0) {
          var basePath = '/' + parts[0] + '/';
          if (pathname !== basePath) {
            window.location.replace(basePath);
          }
        } else {
          window.location.replace('./');
        }
      } catch (e) {
        window.location.replace('./');
      }
    </script>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">N</div>
      <h1>NutriFit AI</h1>
      <p>Your local offline data is safe. Returning to your dashboard...</p>
      <a href="./" class="btn">Return to NutriFit AI</a>
    </div>
  </body>
</html>
